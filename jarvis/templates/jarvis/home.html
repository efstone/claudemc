<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRv2 Landmarks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            color: #8be9fd;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .location-card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }
        .location-card:hover {
            transform: translateY(-5px);
        }
        .location-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .location-info {
            padding: 1rem;
        }
        .location-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f8f8f2;
            margin-bottom: 0.5rem;
        }
        .location-coords {
            font-family: 'Courier New', monospace;
            color: #6272a4;
            font-size: 0.9rem;
        }
        .empty-message {
            text-align: center;
            color: #6272a4;
            font-size: 1.2rem;
            padding: 4rem;
        }
    </style>
</head>
<body>
    <h1>KRv2 Landmarks</h1>
    {% if locations %}
    <div class="gallery">
        {% for location in locations %}
        <div class="location-card">
            <img src="{{ location.screenshot.url }}" alt="{{ location.name }}">
            <div class="location-info">
                <div class="location-name">{{ location.name }}</div>
                <div class="location-coords">{{ location.x }}, {{ location.y }}, {{ location.z }}</div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="empty-message">No landmarks with screenshots yet.</p>
    {% endif %}
</body>
</html>
